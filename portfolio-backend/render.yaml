services:
  - type: web
    name: portfolio-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: OWNER_EMAIL
        sync: false
      - key: MAIL_FROM_NAME
        value: "Sunaina Yaseen Portfolio"
      - key: ALLOWED_ORIGINS
        sync: false
      - key: CONTACT_RATE_LIMIT
        value: "5 per hour"
      - key: FLASK_DEBUG
        value: "false"
      - key: MYSQL_HOST
        sync: false
      - key: MYSQL_USER
        sync: false
      - key: MYSQL_PASSWORD
        sync: false
      - key: MYSQL_DB
        sync: false
